<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wordle Infinite & Infinite Craft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .tab-button {
            padding: 12px 30px;
            border: none;
            background: rgba(255, 255, 255, 0.3);
            color: white;
            cursor: pointer;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            transition: all 0.3s;
        }

        .tab-button.active {
            background: white;
            color: #667eea;
        }

        .tab-button:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .tab-content {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .tab-content.active {
            display: block;
        }

        /* Wordle Styles */
        #wordle-game {
            text-align: center;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 1.1em;
        }

        .game-info span {
            font-weight: bold;
            color: #667eea;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 60px);
            gap: 8px;
            margin: 20px auto;
            justify-content: center;
        }

        .tile {
            width: 60px;
            height: 60px;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            font-weight: bold;
            text-transform: uppercase;
            background: white;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tile.correct {
            background: #6aaa64;
            color: white;
            border-color: #6aaa64;
            transform: scale(1.05);
        }

        .tile.present {
            background: #c9b458;
            color: white;
            border-color: #c9b458;
            transform: scale(1.05);
        }

        .tile.absent {
            background: #787c7e;
            color: white;
            border-color: #787c7e;
            transform: scale(1.05);
        }

        .tile.filled {
            border-color: #999;
            background: #f0f0f0;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
            gap: 6px;
            margin: 20px auto;
            max-width: 500px;
        }

        .key {
            padding: 8px 12px;
            background: #d3d6da;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .key:hover:not(:disabled) {
            background: #b0b3b8;
        }

        .key:disabled {
            opacity: 0.5;
        }

        .key.correct {
            background: #6aaa64;
            color: white;
        }

        .key.present {
            background: #c9b458;
            color: white;
        }

        .key.absent {
            background: #787c7e;
            color: white;
        }

        .input-row {
            display: flex;
            gap: 10px;
            margin: 20px auto;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-row input {
            padding: 10px;
            font-size: 1em;
            border: 2px solid #ddd;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .input-row button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .input-row button:hover {
            background: #764ba2;
        }

        .message {
            margin: 20px;
            font-size: 1.2em;
            font-weight: bold;
            min-height: 30px;
        }

        .message.success {
            color: #6aaa64;
        }

        .message.error {
            color: #e74c3c;
        }

        .message.info {
            color: #667eea;
        }

        /* Infinite Craft Styles */
        #craft-game {
            display: flex;
            gap: 20px;
        }

        .craft-inventory {
            flex: 1;
            max-height: 600px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #f9f9f9;
        }

        .craft-inventory h3 {
            margin-bottom: 15px;
            color: #667eea;
        }

        .element-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
        }

        .element {
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            cursor: grab;
            text-align: center;
            font-weight: bold;
            user-select: none;
            transition: all 0.2s;
            border: 2px solid transparent;
        }

        .element:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .element.new {
            border-color: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        .element.dragging {
            opacity: 0.7;
        }

        .craft-workspace {
            flex: 1;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            padding: 15px;
            min-height: 600px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .craft-workspace h3 {
            color: #667eea;
        }

        .combination-display {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #667eea;
            transition: all 0.2s ease;
        }

        .workspace-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            flex: 1;
        }

        .workspace-slot {
            min-height: 80px;
            background: white;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 10px;
            cursor: cell;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.2s;
        }

        .workspace-slot.drag-over {
            background: #e8f4f8;
            border-color: #667eea;
        }

        .workspace-item {
            padding: 10px 15px;
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            color: white;
            border-radius: 6px;
            cursor: grab;
            font-weight: bold;
            width: 100%;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .workspace-item:hover {
            transform: scale(1.05);
        }

        .craft-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .craft-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .craft-btn:hover {
            background: #764ba2;
        }

        .craft-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .discovered-message {
            background: #2ecc71;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            text-align: center;
            font-weight: bold;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            #craft-game {
                flex-direction: column;
            }

            .board {
                grid-template-columns: repeat(5, 50px);
            }

            .tile {
                width: 50px;
                height: 50px;
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Game Collection</h1>
            <p>Play Wordle with Infinite Tries & Infinite Craft</p>
        </div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('wordle')">🟩 Wordle Infinite</button>
            <button class="tab-button" onclick="switchTab('craft')">⚗️ Infinite Craft</button>
        </div>

        <div id="wordle" class="tab-content active">
            <div id="wordle-game">
                <div class="game-info">
                    <div>Tries: <span id="tries">0</span></div>
                    <div>Word: <span id="word-display">????</span></div>
                </div>

                <div id="message" class="message"></div>

                <div class="board" id="board"></div>

                <div class="input-row">
                    <input type="text" id="guess-input" placeholder="Enter guess" maxlength="5">
                    <button onclick="submitGuess()">Submit</button>
                    <button onclick="newWordleGame()">New Game</button>
                </div>

                <div class="keyboard" id="keyboard"></div>
            </div>
        </div>

        <div id="craft" class="tab-content">
            <div id="craft-game">
                <div class="craft-inventory">
                    <h3>📦 Inventory</h3>
                    <div class="element-grid" id="inventory"></div>
                </div>

                <div class="craft-workspace">
                    <h3>✨ Workspace</h3>
                    <div id="discovered-message"></div>
                    <div class="combination-display" id="combination-display">
                        Drag 2 elements here to combine
                    </div>
                    <div class="workspace-grid" id="workspace"></div>
                    <div class="craft-controls">
                        <button class="craft-btn" onclick="craftCombine()">🔨 Combine</button>
                        <button class="craft-btn" onclick="clearWorkspace()">🗑️ Clear</button>
                        <button class="craft-btn" onclick="resetCraft()">🔄 Reset</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

        function initWordle() {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            wordleState.keyboard = {};
            letters.split('').forEach(letter => {
                wordleState.keyboard[letter] = 'unknown';
            });
        }

        function newWordleGame() {
            wordleState.word = WORDLE_WORDS[Math.floor(Math.random() * WORDLE_WORDS.length)];
            wordleState.guesses = [];
            wordleState.tries = 0;
            wordleState.won = false;
            initWordle();
            drawBoard();
            drawKeyboard();
            updateMessage('');
            document.getElementById('guess-input').value = '';
            document.getElementById('guess-input').focus();
        }

        function drawBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            const maxRows = 6;
            
            // Draw all guess rows
            for (let row = 0; row < maxRows; row++) {
                for (let col = 0; col < 5; col++) {
                    let letter = '';
                    let state = '';
                    
                    if (row < wordleState.guesses.length) {
                        letter = wordleState.guesses[row][col] || '';
                        state = getLetterState(row, col);
                    } else if (row === wordleState.guesses.length) {
                        // Current row - show input value
                        const input = document.getElementById('guess-input');
                        letter = input.value[col] || '';
                    }
                    
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    if (state) tile.classList.add(state);
                    if (letter && !state) tile.classList.add('filled');
                    tile.textContent = letter;
                    board.appendChild(tile);
                }
            }
        }

        function drawKeyboard() {
            const keyboard = document.getElementById('keyboard');
            keyboard.innerHTML = '';
            
            const rows = [
                'QWERTYUIOP',
                'ASDFGHJKL',
                'ZXCVBNM'
            ];
            
            rows.forEach(row => {
                row.split('').forEach(letter => {
                    const key = document.createElement('button');
                    key.textContent = letter;
                    key.className = 'key ' + wordleState.keyboard[letter];
                    key.onclick = () => selectLetter(letter);
                    keyboard.appendChild(key);
                });
            });
        }

        function selectLetter(letter) {
            const input = document.getElementById('guess-input');
            if (input.value.length < 5) {
                input.value += letter;
                input.focus();
            }
        }

        function getLetterState(guessIndex, letterIndex) {
            const guess = wordleState.guesses[guessIndex];
            const letter = guess[letterIndex];
            const wordLetter = wordleState.word[letterIndex];
            
            if (letter === wordLetter) return 'correct';
            if (wordleState.word.includes(letter)) return 'present';
            return 'absent';
        }

        function submitGuess() {
            const input = document.getElementById('guess-input');
            const guess = input.value.toUpperCase();
            
            if (guess.length !== 5) {
                updateMessage('Word must be 5 letters!', 'error');
                return;
            }
            
            wordleState.guesses.push(guess);
            wordleState.tries++;
            input.value = '';
            
            // Update keyboard
            for (let i = 0; i < 5; i++) {
                const letter = guess[i];
                const state = getLetterState(wordleState.guesses.length - 1, i);
                
                if (state === 'correct') {
                    wordleState.keyboard[letter] = 'correct';
                } else if (state === 'present' && wordleState.keyboard[letter] !== 'correct') {
                    wordleState.keyboard[letter] = 'present';
                } else if (state === 'absent' && wordleState.keyboard[letter] === 'unknown') {
                    wordleState.keyboard[letter] = 'absent';
                }
            }
            
            if (guess === wordleState.word) {
                updateMessage(`🎉 You won in ${wordleState.tries} tries!`, 'success');
                wordleState.won = true;
            } else {
                updateMessage(`Try again! ${5 - wordleState.tries} rows left.`, 'info');
            }
            
            drawBoard();
            drawKeyboard();
            document.getElementById('guess-input').focus();
        }

        function handleGuessInput(e) {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
            drawBoard();
        }

        function handleGuessKeydown(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                submitGuess();
            } else if (e.key === 'Backspace') {
                // Allow normal backspace behavior
                setTimeout(() => drawBoard(), 0);
            }
        }

            sorted.forEach(element => {
                const el = document.createElement('div');
                el.className = 'element';
                if (!craftState.inventory.includes(element)) {
                    el.classList.add('new');
                }
                el.textContent = element;
                el.draggable = true;
                el.ondragstart = (e) => {
                    e.dataTransfer.effectAllowed = 'copy';
                    e.dataTransfer.setData('text/plain', element);
                };
                inventory.appendChild(el);
            });
        }

        function drawWorkspace() {
            const workspace = document.getElementById('workspace');
            workspace.innerHTML = '';
            
            craftState.workspace.forEach((item, index) => {
                const slot = document.createElement('div');
                slot.className = 'workspace-slot';
                slot.ondragover = (e) => {
                    e.preventDefault();
                    slot.classList.add('drag-over');
                };
                slot.ondragleave = () => {
                    slot.classList.remove('drag-over');
                };
                slot.ondrop = (e) => {
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    const element = e.dataTransfer.getData('text/plain');
                    craftState.workspace[index] = element;
                    drawWorkspace();
                    updateCombinationDisplay();
                };
                
                if (item) {
                    const workspaceItem = document.createElement('div');
                    workspaceItem.className = 'workspace-item';
                    workspaceItem.textContent = item;
                    workspaceItem.draggable = true;
                    workspaceItem.ondragstart = (e) => {
                        e.dataTransfer.effectAllowed = 'move';
                        e.dataTransfer.setData('text/plain', JSON.stringify({ item, index }));
                    };
                    workspaceItem.ondrop = (e) => {
                        e.stopPropagation();
                    };
                    slot.appendChild(workspaceItem);
                } else {
                    slot.textContent = 'Drop here';
                }
                
                workspace.appendChild(slot);
            });
            
            updateCombinationDisplay();
        }

        function updateCombinationDisplay() {
            const display = document.getElementById('combination-display');
            const items = craftState.workspace.filter(x => x);
            
            if (items.length === 0) {
                display.textContent = 'Drag 2 elements here to combine';
                display.style.color = '#667eea';
            } else if (items.length === 1) {
                display.innerHTML = `<span>${items[0]}</span>`;
                display.style.color = '#667eea';
            } else {
                const key = items.sort().join('+');
                const result = craftState.combinations[key];
                
                if (result) {
                    display.innerHTML = `<span>${items[0]} + ${items[1]} = <strong style="color: #2ecc71; font-size: 1.1em;">${result}</strong></span>`;
                } else {
                    display.innerHTML = `<span>${items[0]} + ${items[1]} = <strong style="color: #e74c3c;">?</strong></span>`;
                }
            }
        }

        function craftCombine() {
            const items = craftState.workspace.filter(x => x);
            if (items.length < 2) {
                alert('You need at least 2 elements to combine!');
                return;
            }
            
            const key = items.sort().join('+');
            const result = craftState.combinations[key];
            
            if (result) {
                // Add animation effect
                const display = document.getElementById('combination-display');
                display.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    display.style.transform = 'scale(1)';
                }, 150);
                
                if (!craftState.discovered.has(result)) {
                    craftState.discovered.add(result);
                    craftState.inventory.push(result);
                    const msg = document.getElementById('discovered-message');
                    msg.innerHTML = `<div class="discovered-message">🎉 Discovered: <strong>${result}</strong>!</div>`;
                    setTimeout(() => {
                        msg.innerHTML = '';
                    }, 3000);
                }
            } else {
                alert('These elements don\'t combine to form anything new!');
            }
            
            clearWorkspace();
        }

        function clearWorkspace() {
            craftState.workspace = ['', '', '', ''];
            drawWorkspace();
            updateCombinationDisplay();
        }

        function resetCraft() {
            if (confirm('Reset all progress?')) {
                craftState.inventory = ['Water', 'Fire', 'Earth', 'Air'];
                craftState.workspace = ['', '', '', ''];
                craftState.discovered = new Set(['Water', 'Fire', 'Earth', 'Air']);
                initCraft();
            }
        }

        // ===== TAB SWITCHING =====
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'wordle') {
                document.getElementById('guess-input').focus();
            }
        }

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            newWordleGame();
            initCraft();
            
            // Setup input listeners for Wordle
            const guessInput = document.getElementById('guess-input');
            guessInput.addEventListener('input', handleGuessInput);
            guessInput.addEventListener('keydown', handleGuessKeydown);
        });
    </script>
</body>
</html>
